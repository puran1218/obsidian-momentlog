name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match manifest.json, e.g. 0.2.3)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        shell: bash
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$MANIFEST_VERSION"
          fi

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release version '$VERSION' does not match manifest.json version '$MANIFEST_VERSION'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.release.outputs.exists != 'true'
        run: npm ci

      - if: steps.release.outputs.exists != 'true'
        run: npm run build

      - name: Attest release assets
        if: steps.release.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: "dist/momentlog/*"

      - name: Verify build provenance
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/momentlog/main.js -R "$GITHUB_REPOSITORY"
          gh attestation verify dist/momentlog/styles.css -R "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            dist/momentlog/main.js \
            dist/momentlog/manifest.json \
            dist/momentlog/styles.css \
            --target "$GITHUB_SHA" \
            --title "Momentlog $VERSION" \
            --generate-notes
