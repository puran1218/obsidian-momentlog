name: Bootstrap npm lockfile

on:
  push:
    branches:
      - fix/community-review-0.2.3

permissions:
  contents: write

jobs:
  bootstrap:
    if: "startsWith(github.event.head_commit.message, 'chore: run lockfile bootstrap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/community-review-0.2.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies for reproducible builds"
          git push origin HEAD:fix/community-review-0.2.3
